<section class="artist-section">

    <div class="artist-header">
        <h2>✩⁺˚ Artists ˚⁺✩</h2>
        <span class="artist-count" id="artistCount">0 artists ☆</span>
    </div>

    <p>Artists around here! Draw, create and share your stuff! ♡</p>

    <hr>

    <div class="artist-toolbar">
        <input
            type="text"
            class="artist-search"
            id="artistSearch"
            placeholder="Search artists..."
        >

        <button
            type="button"
            class="artist-button"
            id="openArtistForm"
        >☆ Add Artist</button>
    </div>

    <div class="artist-table-wrap">
        <table class="artist-table">

            <thead>
                <tr>
                    <th>Artist</th>
                    <th>About</th>
                    <th> </th>
                </tr>
            </thead>

            <tbody id="artistList">
                <tr>
                    <td colspan="3" class="artist-empty">
                        Nobody here yet! Be the first artist! ☆
                    </td>
                </tr>
            </tbody>

        </table>
    </div>

</section>

<hr>
<hr>

<dialog class="artist-dialog" id="artistDialog">

    <h3>☆ Add a new artist!</h3>
    <hr>

    <form id="artistForm">

        <label for="artistPfp">PFP</label>

        <input
            type="file"
            class="artist-upload"
            id="artistPfp"
            accept="image/png,image/jpeg,image/gif,image/webp"
        >

        <div class="artist-preview" id="artistPreview">
            <span class="artist-preview-text">No PFP selected ☆</span>
        </div>

        <label for="artistDisplayName">Artist name</label>
        <input
            type="text"
            id="artistDisplayName"
            maxlength="50"
            placeholder="Your display name"
            required
        >

        <label for="artistUsername">Username</label>
        <input
            type="text"
            id="artistUsername"
            maxlength="30"
            placeholder="@username"
            required
        >

        <label for="artistDescription">About</label>
        <textarea
            id="artistDescription"
            maxlength="860"
            placeholder="Add anything here! 𝙏𝙒: 𝙙𝙤 𝙣𝙤𝙩 𝙖𝙙𝙙 𝙖𝙣𝙮 𝙥𝙚𝙧𝙨𝙤𝙣𝙖𝙡 𝙞𝙣𝙛𝙤𝙧𝙢𝙖𝙩𝙞𝙤𝙣 𝙝𝙚𝙧𝙚."
        ></textarea>

        <hr>

        <div class="artist-dialog-actions">

            <button class="artist-button">
                Add Artist ☆
            </button>

            <button
                type="button"
                class="artist-button"
                id="closeArtistForm"
            >
                Cancel
            </button>

        </div>

    </form>

</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getFirestore,
    collection,
    doc,
    setDoc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";


/* =================================
   INITIALIZATION
================================= */

const firebaseConfig = {
    apiKey: "AIzaSyDVutuJI5YIVcU_nGdneVxXpsZNttgEVjw",
    authDomain: "monbooru-posts.firebaseapp.com",
    projectId: "monbooru-posts",
    storageBucket: "monbooru-posts.firebasestorage.app",
    messagingSenderId: "318383178534",
    appId: "1:318383178534:web:ec84a945c58a1afbbcb7e7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const artistCollection = collection(db, "artists");


/* =================================
   ELEMENTS
================================= */

const artistList = document.getElementById("artistList");
const artistDialog = document.getElementById("artistDialog");
const artistForm = document.getElementById("artistForm");

const artistSearch = document.getElementById("artistSearch");
const artistCount = document.getElementById("artistCount");

const artistPfpInput = document.getElementById("artistPfp");
const artistPreview = document.getElementById("artistPreview");

const artistNameInput = document.getElementById("artistDisplayName");
const artistUsernameInput = document.getElementById("artistUsername");
const artistDescriptionInput = document.getElementById("artistDescription");

const openArtistButton = document.getElementById("openArtistForm");
const closeArtistButton = document.getElementById("closeArtistForm");

const addArtistButton = artistForm.querySelector(
    ".artist-dialog-actions button:first-child"
);


/* =================================
   PAGINATION SETUP
================================= */

const ARTISTS_PER_PAGE = 10;

let currentPage = 1;

const artistTableWrap = document.querySelector(".artist-table-wrap");

const pagination = document.createElement("nav");

pagination.className = "artist-pagination";
pagination.setAttribute("aria-label", "Artist directory pages");

artistTableWrap.after(pagination);


/* =================================
   STATUS MESSAGE
================================= */

const artistStatus = document.createElement("p");

artistStatus.id = "artistStatus";
artistStatus.setAttribute("role", "status");
artistStatus.setAttribute("aria-live", "polite");
artistStatus.hidden = true;

artistForm.querySelector(".artist-dialog-actions")
    .before(artistStatus);

function showArtistMessage(message, type = "error") {
    artistStatus.textContent = message;
    artistStatus.className = `artist-status artist-status-${type}`;
    artistStatus.hidden = false;
}

function clearArtistMessage() {
    artistStatus.textContent = "";
    artistStatus.hidden = true;
}


/* =================================
   DIRECTORY STATE
================================= */

let artists = [];
let selectedArtistPfp = "";
let artistStoragePromise = null;
let addingArtist = false;


/* =================================
   INDEXEDDB PFP STORAGE
================================= */

function openArtistStorage() {
    if (artistStoragePromise) {
        return artistStoragePromise;
    }

    artistStoragePromise = new Promise((resolve, reject) => {
        const request = indexedDB.open("monbooruDB");

        request.onupgradeneeded = () => {
            const database = request.result;

            if (!database.objectStoreNames.contains("artists")) {
                database.createObjectStore("artists", {
                    keyPath: "id"
                });
            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            artistStoragePromise = null;
            reject(request.error);
        };
    });

    return artistStoragePromise;
}


async function saveArtistPfp(id, data) {
    const database = await openArtistStorage();

    return new Promise((resolve, reject) => {
        const transaction = database.transaction(
            "artists",
            "readwrite"
        );

        transaction.objectStore("artists").put({
            id,
            data
        });

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
    });
}


async function getArtistPfp(id) {
    const database = await openArtistStorage();

    return new Promise((resolve, reject) => {
        const transaction = database.transaction(
            "artists",
            "readonly"
        );

        const request = transaction
            .objectStore("artists")
            .get(id);

        request.onsuccess = () => {
            resolve(request.result?.data || "");
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}


/* =================================
   PFP PREVIEW
================================= */

function showArtistPreview(source) {
    artistPreview.replaceChildren();

    if (!source) {
        const message = document.createElement("span");

        message.className = "artist-preview-text";
        message.textContent = "No PFP selected ☆";

        artistPreview.appendChild(message);
        return;
    }

    const image = document.createElement("img");

    image.src = source;
    image.alt = "PFP preview";

    artistPreview.appendChild(image);
}


artistPfpInput.addEventListener("change", () => {
    const file = artistPfpInput.files[0];

    selectedArtistPfp = "";
    showArtistPreview("");

    if (!file) return;

    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/gif",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {
        artistPfpInput.value = "";

        showArtistMessage(
            "That image format isn't supported! Please choose PNG, JPEG, GIF, or WebP. ☆"
        );

        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        artistPfpInput.value = "";

        showArtistMessage(
            "Your PFP is too large! Please choose an image under 5 MB. ☆"
        );

        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        selectedArtistPfp = reader.result;
        showArtistPreview(selectedArtistPfp);
        clearArtistMessage();
    };

    reader.onerror = () => {
        showArtistMessage(
            "Couldn't read that image! Please try another one. ☆"
        );
    };

    reader.readAsDataURL(file);
});


/* =================================
   TABLE HEADER
================================= */

const artistTableHeader = artistList
    .closest("table")
    .querySelector("thead tr");

while (artistTableHeader.children.length > 2) {
    artistTableHeader.lastElementChild.remove();
}


/* =================================
   FILTER ARTISTS
================================= */

function getFilteredArtists() {
    const query = artistSearch.value
        .trim()
        .toLowerCase();

    return artists.filter(artist => {
        return (
            artist.name.toLowerCase().includes(query) ||
            artist.username.toLowerCase().includes(query)
        );
    });
}


/* =================================
   PAGINATION BUTTONS
================================= */

function createPageButton(label, page, options = {}) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "artist-page-button";
    button.textContent = label;

    if (options.active) {
        button.classList.add("active");
        button.setAttribute("aria-current", "page");
    }

    if (options.disabled) {
        button.disabled = true;
    }

    button.addEventListener("click", () => {
        if (page === currentPage || options.disabled) return;

        currentPage = page;
        renderArtists();
    });

    return button;
}


function renderPagination(totalPages) {
    pagination.replaceChildren();

    if (totalPages <= 1) {
        pagination.hidden = true;
        return;
    }

    pagination.hidden = false;

    /* PREVIOUS */

    pagination.appendChild(
        createPageButton(
            "‹ Prev",
            Math.max(1, currentPage - 1),
            {
                disabled: currentPage === 1
            }
        )
    );

    /* PAGE NUMBERS */

    let pages = [];

    if (totalPages <= 7) {
        pages = Array.from(
            { length: totalPages },
            (_, index) => index + 1
        );

    } else {
        pages.push(1);

        const start = Math.max(2, currentPage - 1);
        const end = Math.min(totalPages - 1, currentPage + 1);

        if (start > 2) {
            pages.push("...");
        }

        for (let page = start; page <= end; page++) {
            pages.push(page);
        }

        if (end < totalPages - 1) {
            pages.push("...");
        }

        pages.push(totalPages);
    }

    pages.forEach(page => {
        if (page === "...") {
            const dots = document.createElement("span");

            dots.className = "artist-page-dots";
            dots.textContent = "...";

            pagination.appendChild(dots);
            return;
        }

        pagination.appendChild(
            createPageButton(
                String(page),
                page,
                {
                    active: page === currentPage
                }
            )
        );
    });

    /* NEXT */

    pagination.appendChild(
        createPageButton(
            "Next ›",
            Math.min(totalPages, currentPage + 1),
            {
                disabled: currentPage === totalPages
            }
        )
    );

    /* PAGE INDICATOR */

    const info = document.createElement("span");

    info.className = "artist-page-info";
    info.textContent = `Page ${currentPage} of ${totalPages}`;

    pagination.appendChild(info);
}


/* =================================
   RENDER ARTISTS
================================= */

function renderArtists() {
    const filteredArtists = getFilteredArtists();

    const totalPages = Math.ceil(
        filteredArtists.length / ARTISTS_PER_PAGE
    );

    if (currentPage > totalPages) {
        currentPage = Math.max(1, totalPages);
    }

    artistCount.textContent =
        `${artists.length} ${artists.length === 1 ? "artist" : "artists"} ☆`;

    artistList.replaceChildren();

    if (filteredArtists.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 2;
        cell.className = "artist-empty";

        cell.textContent = artists.length
            ? "No artist found! ☆"
            : "Nobody here yet! Be the first artist! ☆";

        row.appendChild(cell);
        artistList.appendChild(row);

        renderPagination(0);
        return;
    }

    const startIndex = (currentPage - 1) * ARTISTS_PER_PAGE;

    const visibleArtists = filteredArtists.slice(
        startIndex,
        startIndex + ARTISTS_PER_PAGE
    );

    visibleArtists.forEach(artist => {
        const row = document.createElement("tr");

        /* ARTIST */

        const personCell = document.createElement("td");
        const person = document.createElement("div");

        person.className = "artist-person";

        if (artist.pfp) {
            const pfp = document.createElement("img");

            pfp.className = "artist-pfp";
            pfp.src = artist.pfp;
            pfp.alt = "";
            pfp.loading = "lazy";

            pfp.onerror = () => pfp.remove();

            person.appendChild(pfp);
        }

        const identity = document.createElement("div");

        const name = document.createElement("div");
        name.className = "artist-name";
        name.textContent = artist.name;

        const username = document.createElement("div");
        username.className = "artist-username";
        username.textContent =
            "@" + artist.username.replace(/^@+/, "");

        identity.append(name, username);
        person.appendChild(identity);
        personCell.appendChild(person);

        /* ABOUT */

        const descriptionCell = document.createElement("td");

        descriptionCell.className = "artist-description";
        descriptionCell.textContent =
            artist.description || "Just an artist! ☆";

        row.append(personCell, descriptionCell);
        artistList.appendChild(row);
    });

    renderPagination(totalPages);
}


/* =================================
   OPEN DIALOG
================================= */

openArtistButton.addEventListener("click", () => {
    clearArtistMessage();
    artistDialog.showModal();
});


/* =================================
   CLOSE DIALOG
================================= */

closeArtistButton.addEventListener("click", () => {
    artistDialog.close();
});


/* =================================
   ADD ARTIST
================================= */

addArtistButton.addEventListener("click", async event => {
    event.preventDefault();

    if (addingArtist) return;

    if (!artistForm.reportValidity()) {
        showArtistMessage(
            "Some required information is missing! Please check your entries. ☆"
        );

        return;
    }

    const name = artistNameInput.value.trim();

    const username = artistUsernameInput.value
        .trim()
        .replace(/^@+/, "");

    const description = artistDescriptionInput.value.trim();

    if (!name || !username) {
        showArtistMessage(
            "Please enter both an artist name and a username! ☆"
        );

        return;
    }

    if (/\s/.test(username)) {
        showArtistMessage(
            "Your username cannot contain spaces! ☆"
        );

        return;
    }

    addingArtist = true;
    addArtistButton.disabled = true;

    try {
        const artistDocument = doc(artistCollection);
        const artistId = artistDocument.id;

        const pfpId = selectedArtistPfp
            ? artistId
            : "";

        if (selectedArtistPfp) {
            await saveArtistPfp(
                pfpId,
                selectedArtistPfp
            );
        }

        await setDoc(artistDocument, {
            name,
            username,
            description,
            pfpId,
            joined: serverTimestamp()
        });

        artistForm.reset();

        selectedArtistPfp = "";
        showArtistPreview("");

        currentPage = 1;

        showArtistMessage(
            "Your artist account has been added successfully! Welcome aboard! ☆",
            "success"
        );

        setTimeout(() => {
            artistDialog.close();
            clearArtistMessage();
        }, 1500);

    } catch (error) {
        console.error("Artist registration error:", error);

        showArtistMessage(
            "Couldn't add your artist account! Please try again. ☆"
        );

    } finally {
        addingArtist = false;
        addArtistButton.disabled = false;
    }
});


/* =================================
   PREVENT ENTER SUBMISSION
================================= */

artistForm.addEventListener("keydown", event => {
    if (
        event.key === "Enter" &&
        event.target.tagName !== "TEXTAREA"
    ) {
        event.preventDefault();
    }
});


/* =================================
   SEARCH
================================= */

artistSearch.addEventListener("input", () => {
    currentPage = 1;
    renderArtists();
});


/* =================================
   LIVE DIRECTORY UPDATES
================================= */

onSnapshot(
    artistCollection,

    async snapshot => {
        try {
            const loadedArtists = await Promise.all(
                snapshot.docs.map(async artistDocument => {
                    const data = artistDocument.data();

                    let pfp = "";

                    if (data.pfpId) {
                        try {
                            pfp = await getArtistPfp(data.pfpId);
                        } catch (error) {
                            console.error("PFP loading error:", error);
                        }
                    }

                    return {
                        id: artistDocument.id,

                        name: typeof data.name === "string"
                            ? data.name
                            : "",

                        username: typeof data.username === "string"
                            ? data.username
                            : "",

                        description: typeof data.description === "string"
                            ? data.description
                            : "",

                        pfpId: data.pfpId || "",
                        pfp
                    };
                })
            );

            artists = loadedArtists;
            renderArtists();

        } catch (error) {
            console.error("Artist directory error:", error);

            showArtistMessage(
                "Couldn't load the artist directory! Please try again later. ☆"
            );
        }
    },

    error => {
        console.error("Artist directory update error:", error);

        showArtistMessage(
            "Couldn't load the artist directory! Please refresh and try again. ☆"
        );
    }
);


/* =================================
   INITIALIZE
================================= */

showArtistPreview("");
renderArtists();

</script>

</body>
</html>
